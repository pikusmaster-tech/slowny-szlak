<!doctype html><meta charset="utf-8">
<style>
@font-face { font-family: N; src: url('../../www/fonts/nunito-latin-ext-wght-normal.woff2'); font-weight: 200 1000; unicode-range: U+0100-02AF; }
@font-face { font-family: N; src: url('../../www/fonts/nunito-latin-wght-normal.woff2'); font-weight: 200 1000; unicode-range: U+0000-00FF; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; font-family: N; }
body { background: linear-gradient(170deg, var(--a), var(--b)); display: flex; flex-direction: column; align-items: center; }
h1 { margin: 92px 60px 0; color: #fff; font-size: 84px; line-height: 1.05; font-weight: 1000; text-align: center; text-shadow: 0 6px 0 rgba(0,0,0,.18), 0 16px 40px rgba(0,0,0,.3); }
h1 em { font-style: normal; color: #ffd34d; }
.tel { margin-top: 70px; width: 820px; height: 1458px; border-radius: 70px; padding: 18px; background: #0d0f22; box-shadow: 0 50px 100px rgba(0,0,0,.45), inset 0 0 0 3px rgba(255,255,255,.12); }
.tel img { width: 100%; height: 100%; border-radius: 54px; object-fit: cover; object-position: top; display: block; }
</style>
<body>
<h1 id="t"></h1>
<div class="tel"><img id="i"></div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('t').innerHTML = q.get('t');
document.getElementById('i').src = q.get('i');
document.body.style.setProperty('--a', q.get('a') || '#2a1a5e');
document.body.style.setProperty('--b', q.get('b') || '#b0477a');
</script>
