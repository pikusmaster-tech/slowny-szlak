name: Wydanie na Google Play

on:
  workflow_dispatch:
    inputs:
      sciezka:
        description: 'Ścieżka w Google Play (internal, alpha, beta, production)'
        default: internal
      sklep:
        description: 'Zaktualizować też opis i zrzuty w sklepie?'
        type: boolean
        default: false
      szkic:
        description: 'Wydanie jako szkic (konieczne, dopóki aplikacja nie jest opublikowana w sklepie)'
        type: boolean
        default: true
  push:
    tags: ['v*']

jobs:
  wydanie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Klucz podpisu
        env:
          KLUCZ_BASE64: ${{ secrets.KLUCZ_BASE64 }}
        run: echo "$KLUCZ_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Budowanie pakietu AAB
        env:
          KLUCZ_PLIK: ${{ runner.temp }}/upload.jks
          KLUCZ_HASLO: ${{ secrets.KLUCZ_HASLO }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_PELNOEKRANOWA: ${{ vars.ADMOB_PELNOEKRANOWA }}
          ADMOB_NAGRODZONA: ${{ vars.ADMOB_NAGRODZONA }}
        run: bash narzedzia/zbuduj.sh
      - uses: actions/upload-artifact@v4
        with:
          name: slowny-szlak-aab
          path: aplikacja/android/app/build/outputs/bundle/release/app-release.aab
      - name: Wysyłka do Google Play
        env:
          PLAY_KONTO: ${{ secrets.PLAY_KONTO }}
        # Wydanie po tagu idzie jako szkic, dopóki zmienna repozytorium PLAY_SZKIC nie zostanie ustawiona na 'false'.
        run: >
          node narzedzia/publikuj.mjs aplikacja/android/app/build/outputs/bundle/release/app-release.aab
          "${{ inputs.sciezka || 'internal' }}"
          ${{ inputs.sklep && '--sklep' || '' }}
          ${{ ((github.event_name == 'workflow_dispatch' && inputs.szkic) || (github.event_name == 'push' && vars.PLAY_SZKIC != 'false')) && '--szkic' || '' }}
